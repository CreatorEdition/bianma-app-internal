name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-boundary:
    name: Public Release Boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Audit public release boundary
        run: node scripts/audit-public-release-preflight.mjs

      - name: Audit committed public tree boundary
        env:
          TREE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/audit-product-migration-guard.mjs
          --committed
          --tree "$TREE_SHA"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

  frontend:
    name: Frontend Checks
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

  backend:
    name: Legacy Backend Checks
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check routing-core
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -p routing-core --all-targets --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml -p routing-core --all-targets --locked -- -D warnings
          test "$(cargo tree --manifest-path src-tauri/Cargo.toml -p routing-core --locked --edges normal --prefix none | wc -l)" -eq 1

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked


  ingress-contract:
    name: Ingress Contract Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy ingress-contract
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p ingress-contract --all-targets --locked -- -D warnings

      - name: Test ingress-contract
        run: cargo test --manifest-path src-tauri/Cargo.toml -p ingress-contract --all-targets --locked

      - name: Run ingress-contract doc tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p ingress-contract --doc --locked

  ingress-contract-msrv:
    name: Ingress Contract MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Test ingress-contract on declared MSRV
        run: cargo test --manifest-path src-tauri/Cargo.toml -p ingress-contract --all-targets --locked

      - name: Run ingress-contract doc tests on declared MSRV
        run: cargo test --manifest-path src-tauri/Cargo.toml -p ingress-contract --doc --locked
